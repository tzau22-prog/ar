<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowman AR</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam;">
        <a-marker preset="hiro" smooth="true">
            <!-- Snowman Entity with position, scale, and rotation adjustment -->
            <a-entity position="0 -1 0.5" scale="0.5 0.5 0.5" rotation="-90 0 0">
                <!-- Hat (Red Cylinder) -->
                <a-cylinder 
                    position="0 3 -5" 
                    radius="0.2" 
                    height="0.7" 
                    color="red">
                </a-cylinder>
                
                <!-- Head (Sphere) -->
                <a-sphere 
                    position="0 2.4 -5" 
                    radius="0.5" 
                    color="white">
                </a-sphere>

                <!-- Body (Sphere) -->
                <a-sphere 
                    position="0 1.3 -5" 
                    radius="0.8" 
                    color="white">
                </a-sphere>
            </a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
