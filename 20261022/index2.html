<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Animation Select</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

    <style>
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
        }

        select {
            font-size: 18px;
            padding: 10px 12px;
            border-radius: 8px;
            border: none;
            background-color: royalblue;
            color: white;
            cursor: pointer;
        }
        
        select option {
            background-color: white;
            color: black;
        }
    </style>
</head>

<body>
    <div id="hud">  
        <select id="animationSelect">
            <option value="RobotArmature|Robot_Walking" selected>歩く</option>
            <option value="RobotArmature|Robot_Dance">おどる</option>
        </select>
    </div>
    
    <a-scene embedded arjs="sourceType: webcam">

        <a-marker preset="hiro" smooth="true">
            <a-gltf-model 
                id="robot" 
                src="robot.glb" 
                position="0 0 0.5" 
                scale="0.3 0.3 0.3" 
                rotation="-90 0 0"
                animation-mixer="clip: RobotArmature|Robot_Walking">
            </a-gltf-model>
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

    <script>
        const robot = document.getElementById("robot");
        const animationSelect = document.getElementById("animationSelect");

        function changeAnimation() {
            // "clip: アニメーション名" の形式でプロパティを渡す
            robot.setAttribute("animation-mixer", "clip: " + animationSelect.value);
        }

        animationSelect.addEventListener("change", changeAnimation);
    </script>
</body>

</html>
