<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Robot Controls</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

    <style>
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        select {
            font-size: 16px;
            padding: 10px 12px;
            border-radius: 8px;
            border: none;
            background-color: white;
            color: black;
            cursor: pointer;
        }

        button {
            font-size: 16px;
            padding: 10px 16px;
            border: none;
            background-color: royalblue;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:active {
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div id="hud">  
        <select id="animationSelect">
            <option value="RobotArmature|Robot_Walking" selected>あるく</option>
            <option value="RobotArmature|Robot_Dance">おどる</option>
        </select>
        <button id="enlargeButton">拡大</button>
        <button id="shrinkButton">縮小</button>
        <button id="rotateButton">回転</button>
        <button id="reverseRotateButton">逆回転</button>
    </div>
    
    <a-scene embedded arjs="sourceType: webcam">

        <a-marker preset="hiro" smooth="true">
            <a-gltf-model 
                id="robot" 
                src="robot.glb" 
                position="0 0 0.5" 
                scale="0.3 0.3 0.3" 
                rotation="-90 0 0"
                animation-mixer="clip: RobotArmature|Robot_Walking">
            </a-gltf-model>
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

    <script>
        const robot = document.getElementById("robot");
        const animationSelect = document.getElementById("animationSelect");
        const enlargeButton = document.getElementById("enlargeButton");
        const shrinkButton = document.getElementById("shrinkButton");
        const rotateButton = document.getElementById("rotateButton");
        const reverseRotateButton = document.getElementById("reverseRotateButton");

        // アニメーション切り替え
        animationSelect.addEventListener("change", () => {
            robot.setAttribute("animation-mixer", "clip: " + animationSelect.value);
        });

        // 拡大
        enlargeButton.addEventListener("click", () => {
            const scale = robot.getAttribute("scale");
            robot.setAttribute("scale", {
                x: scale.x + 0.05,
                y: scale.y + 0.05,
                z: scale.z + 0.05
            });
        });

        // 縮小
        shrinkButton.addEventListener("click", () => {
            const scale = robot.getAttribute("scale");
            if (scale.x > 0.05) {
                robot.setAttribute("scale", {
                    x: scale.x - 0.05,
                    y: scale.y - 0.05,
                    z: scale.z - 0.05
                });
            }
        });

        // 回転
        rotateButton.addEventListener("click", () => {
            const rotation = robot.getAttribute("rotation");
            robot.setAttribute("rotation", {
                x: rotation.x,
                y: rotation.y,
                z: rotation.z + 15
            });
        });

        // 逆回転
        reverseRotateButton.addEventListener("click", () => {
            const rotation = robot.getAttribute("rotation");
            robot.setAttribute("rotation", {
                x: rotation.x,
                y: rotation.y,
                z: rotation.z - 15
            });
        });
    </script>
</body>

</html>
