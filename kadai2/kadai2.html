<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Assignment 2</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

    <style>
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        select {
            font-size: 16px;
            padding: 10px 12px;
            border-radius: 8px;
            border: none;
            background-color: white;
            color: black;
            cursor: pointer;
        }

        button {
            font-size: 16px;
            padding: 10px 16px;
            border: none;
            background-color: royalblue;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:active {
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div id="hud">  
        <!-- Change these option values and text to match your new model's animations -->
        <select id="animationSelect">
            <option value="AnimationName1" selected>アニメーション1</option>
            <option value="AnimationName2">アニメーション2</option>
        </select>
        <button id="enlargeButton">拡大</button>
        <button id="shrinkButton">縮小</button>
        <button id="rotateButton">回転</button>
        <button id="reverseRotateButton">逆回転</button>
    </div>
    
    <a-scene embedded arjs="sourceType: webcam">

        <a-marker preset="hiro" smooth="true">
            <a-entity id="model" position="0 0 0.5" scale="0.3 0.3 0.3">
                <!-- Change "your-model.glb" to your actual downloaded CC0 model filename -->
                <a-gltf-model 
                    id="robot" 
                    src="your-model.glb" 
                    position="0 0 0" 
                    rotation="-90 0 0"
                    animation-mixer="clip: AnimationName1">
                </a-gltf-model>
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

    <script>
        const robot = document.getElementById("robot");
        const animationSelect = document.getElementById("animationSelect");
        const enlargeButton = document.getElementById("enlargeButton");
        const shrinkButton = document.getElementById("shrinkButton");
        const rotateButton = document.getElementById("rotateButton");
        const reverseRotateButton = document.getElementById("reverseRotateButton");
        const model = document.getElementById("model");
        
        let size = 0.3;

        function enlargeModel() {
            size += 0.05;
            model.setAttribute("scale", `${size} ${size} ${size}`);
        }
        enlargeButton.addEventListener("click", enlargeModel);

        function shrinkModel() {
            if (size > 0.05) {
                size -= 0.05;
                model.setAttribute("scale", `${size} ${size} ${size}`);
            }
        }
        shrinkButton.addEventListener("click", shrinkModel);
        
        let angle = 0;

        function rotateModel() {
            angle += 15;
            model.setAttribute("rotation", `-90 0 ${angle}`);
        }
        rotateButton.addEventListener("click", rotateModel);

        function reverseRotateModel() {
            angle -= 15;
            model.setAttribute("rotation", `-90 0 ${angle}`);
        }
        reverseRotateButton.addEventListener("click", reverseRotateModel);

        function changeAnimation() {
            robot.setAttribute("animation-mixer", "clip: " + animationSelect.value);
        }
        animationSelect.addEventListener("change", changeAnimation);
    </script>
</body>

</html>
