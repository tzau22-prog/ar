<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Frame Coin</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <a-sky color="steelblue"></a-sky>

  
        <a-cylinder
            position="0 1.5 -3"
            rotation="90 0 0"
            radius="0.6"
            height="0.08"
            color="gold"
            animation="
                property: rotation;
                to: 90 360 0;
                loop: true;
                easing: linear;
                dur: 3000;">
        </a-cylinder>
    </a-scene>
</body>
</html>
