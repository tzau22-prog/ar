<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kadai1</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
</head>
<body>
    <a-scene physics="gravity: -9.8" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
        
        <a-assets>
            <img id="brick" src="assets/brick.jpg">
            <img id="floorTex" src="assets/metal.jpg">
            <img id="saturnTex" src="assets/2k_saturn.jpg">
            <img id="ringTex" src="assets/2k_saturn_ring_alpha.png">
        </a-assets>

       
        <a-sky color="#0b091a"></a-sky>

        <a-plane 
            src="#floorTex" 
            rotation="-90 0 0" 
            width="16" 
            height="16" 
            static-body>
        </a-plane>

        <a-plane 
            src="#brick" 
            position="0 5 -8" 
            width="16" 
            height="10" 
            static-body>
        </a-plane>

       
        <a-entity position="0 4.5 -4"
         animation="property: rotation;
          to: 0 360 0;
           dur: 12000;
            loop: true; easing: linear">
        
            <a-sphere radius="0.7" src="#saturnTex"></a-sphere>
            
            
            <a-torus 
                radius="1.4" 
                radius-tubular="0.02" 
                rotation="75 0 0" 
                src="#ringTex" 
                opacity="0.8">
            </a-torus>
        </a-entity>

       
        <a-box id="target1" position="-1 0.5 -4" width="0.8" height="1.2" depth="0.8" color="#ffbe0b" dynamic-body></a-box>
        <a-box id="target2" position="0 0.5 -4"  width="0.8" height="1.2" depth="0.8" color="#ff006e" dynamic-body></a-box>
        <a-box id="target3" position="1 0.5 -4"  width="0.8" height="1.2" depth="0.8" color="#8338ec" dynamic-body></a-box>
        <a-box id="targetTop" position="0 1.7 -4" width="0.8" height="1.2" depth="0.8" color="#3a86ff" dynamic-body></a-box>

       
        <a-sphere id="ball" class="clickable" position="0 1.2 1" radius="0.35" color="#00f5d4" dynamic-body></a-sphere>

       
        <a-entity position="0 1.8 3">
            <a-camera id="camera">
                <a-text id="scoreText" value="SCORE: 0" position="-1 1 -2" color="#00f5d4" width="4"></a-text>
            </a-camera>
        </a-entity>

        <script>
            
            const ball = document.getElementById("ball");
            const camera = document.getElementById("camera");
            const scoreText = document.getElementById("scoreText");
            let score =0;

            const targets = [
                document.getElementById("target1"),
                document.getElementById("target2"),
                document.getElementById("target3"),
                document.getElementById("targetTop")
            ];

            ball.addEventListener("click", () => {
                const direction = new THREE.Vector3();
                camera.object3D.getWorldDirection(direction);

                ball.body.applyImpulse(
                    new CANNON.Vec3(direction.x * -500, direction.y * -500, direction.z * -500),
                    ball.body.position
                );
            });

            
            targets.forEach((target) => {
                let hit = false;
                target.addEventListener("collide", (e) => {
                    if (e.detail.body.el === ball && !hit) {
                        hit = true;
                        target.setAttribute("color", "#ff0000"); 
                        score += 100;
                        scoreText.setAttribute("value", `ARCADE SCORE: ${score}`);
                    }
                });
            });
        </script>
    </a-scene>
</body>
</html>
