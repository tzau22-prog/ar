<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

    <style>
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
        }
        .diff-btn {
            font-size: 14px;
            padding: 5px 10px;
            margin-top: 5px;
            cursor: pointer;
        }
        #gameStatus {
            margin-top: 8px;
            font-size: 18px;
            color: crimson;
        }
    </style>

</head>

<body>
    <div id="hud">
        <p>ROBOT HP:<span id="robotHpText">50</span></p>
        <progress id="robotHpBar" max="50" value="50"></progress>
        <br>
        <p>自分のHP:<span id="myHpText">50</span></p>
        <progress id="myHpBar" max="50" value="50"></progress>
        <br>
        <p style="font-size: 14px; margin: 5px 0 2px 0;">難易度選択:</p>
        <button id="easyBtn" class="diff-btn">よわい</button>
        <button id="normalBtn" class="diff-btn">ふつう</button>
        <button id="hardBtn" class="diff-btn">つ強い</button>
        <!-- Game Over / Victory Status Message -->
        <div id="gameStatus"></div>
    </div>
    
    <a-scene 
    embedded 
    arjs="sourceType: webcam"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable">

        <a-marker preset="hiro" smooth="true">
            <a-entity id="model" position="0 0 0.5">
                <a-gltf-model 
                id="robot" 
                class="clickable" 
                src="robot.glb" 
                position="0 0 0" 
                scale="0.3 0.3 0.3" 
                rotation="-90 0 0"
                animation-mixer="clip: *">
                </a-gltf-model>
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

    <script>
        const robot = document.getElementById("robot");
        const robotHpText = document.getElementById("robotHpText");
        const robotHpBar = document.getElementById("robotHpBar");
        const myHpText = document.getElementById("myHpText");
        const myHpBar = document.getElementById("myHpBar");
        const gameStatus = document.getElementById("gameStatus");

        let robotHp = 50;
        let myHp = 50;
        let isGameOver = false;

        // Difficulty Settings
        let missChance = 0.3;
        let damageMultiplier = 1;

        const easyBtn = document.getElementById("easyBtn");
        const normalBtn = document.getElementById("normalBtn");
        const hardBtn = document.getElementById("hardBtn");

        easyBtn.addEventListener("click", () => {
            missChance = 0.1;
            damageMultiplier = 2;
            alert("難易度: よわい に設定しました");
        });

        normalBtn.addEventListener("click", () => {
            missChance = 0.3;
            damageMultiplier = 1;
            alert("難易度: ふつう に設定しました");
        });

        hardBtn.addEventListener("click", () => {
            missChance = 0.5;
            damageMultiplier = 0.5;
            alert("難易度: つ強い に設定しました");
        });

        const hitSound = new Audio ("hit.mp3");
        const missSound = new Audio ("miss.mp3");
        const deathSound = new Audio ("death.mp3");

        function attack(){
            if (isGameOver || robotHp == 0 || myHp == 0){
                return;
            }

            if (Math.random() < missChance){
                try { missSound.play(); } catch(e) {}
                return;
            }

            let baseDamage = Math.floor(Math.random() * 10) + 1;
            let damage = Math.floor(baseDamage * damageMultiplier);
            if (damage < 1) damage = 1;

            robotHp -= damage;
            if (robotHp < 0) robotHp = 0;
            
            robotHpText.textContent = robotHp;
            robotHpBar.value = robotHp;
            
            if (robotHp == 0){
                isGameOver = true;
                gameStatus.style.color = "forestgreen";
                gameStatus.textContent = "🎉 勝利！(VICTORY)";
                deathAnimation();
            } else {
                hitAnimation();
            }
        }

        function deathAnimation(){
            robot.removeAttribute("animation-mixer");
            robot.setAttribute(
                "animation-mixer",
                {
                    clip: "RobotArmature|Robot_Death",
                    loop: "once",
                    clampWhenFinished: true
                }
            );
            try { hitSound.play(); } catch(e) {}
        }

        function hitAnimation(){
            robot.removeAttribute("animation-mixer");
            robot.setAttribute(
                "animation-mixer",
                {
                    clip: "RobotArmature|Robot_Jump",
                    loop: "once",
                }
            );
            try { deathSound.play(); } catch(e) {}
        }
    
        robot.addEventListener("click", attack);

        const enemySound = new Audio("enemy-attack.mp3");

        function enemyAttack(){
            if (isGameOver || robotHp == 0) return;

            enemyAnimation();
            myHp -= Math.floor (Math.random() * 10 + 1);

            if (myHp < 0) myHp = 0;

            myHpText.textContent = myHp;
            myHpBar.value = myHp;

            if (myHp == 0) {
                isGameOver = true;
                gameStatus.style.color = "crimson";
                gameStatus.textContent = "💀 ゲームオーバー (GAME OVER)";
            }
        }

        function enemyAnimation (){
            robot.removeAttribute("animation-mixer");
            robot.setAttribute(
                "animation-mixer",
                {
                    clip: "RobotArmature|Robot_Punch",
                    loop: "once",
                }
            );
            try { enemySound.play(); } catch(e) {}
        }

        robot.addEventListener("animation-finished", function (event){
            if (!isGameOver && event.detail.action.getClip().name == "RobotArmature|Robot_Jump"){
                enemyAttack();
            }
        });
    </script>
</body>

</html>
